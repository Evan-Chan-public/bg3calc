{% extends "base.html" %}

{% block title %}Data Entry Form{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Data Entry Form</h1>
    <form method="POST" action="{{ url_for('index') }}">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" step="any" required>
        </div>

        <div class="form-group">
            <label for="strength">Strength:</label>
            <input type="number" id="strength" name="strength" step="any" required>
        </div>

        <div class="form-group">
            <label for="dexterity">Dexterity:</label>
            <input type="number" id="dexterity" name="dexterity" step="any" required>
        </div>

        <div class="form-group">
            <label for="constitution">Consitution:</label>
            <input type="number" id="constitution" name="constitution" step="any" required>
        </div>

        <div class="form-group">
            <label for="intelligence">Intelligence:</label>
            <input type="number" id="intelligence" name="intelligence" step="any" required>
        </div>

        <div class="form-group">
            <label for="wisdom">Wisdom:</label>
            <input type="number" id="wisdom" name="wisdom" step="any" required>
        </div>

        <div class="form-group">
            <label for="charisma">Charisma:</label>
            <input type="number" id="charisma" name="charisma" step="any" required>
        </div>
        
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
